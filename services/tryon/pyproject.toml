[project]
name = "warewise-tryon"
version = "0.1.0"
description = "Warewise try-on service: outfit renders on free Hugging Face try-on Spaces, cached; 3D avatar textures."
requires-python = ">=3.12"
dependencies = [
    "warewise-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "supabase>=2.10",
    "gradio_client>=1.5",
    "pillow>=11",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "BLE", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "E501"]
