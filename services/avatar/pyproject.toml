[project]
name = "warewise-avatar"
version = "0.2.0"
description = "Warewise avatar service: builds and versions each user's 3D avatar (photo, 360° body scan, face scan) and its measurements."
requires-python = ">=3.12"
dependencies = [
    "warewise-contracts",          # packages/contracts-py, installed editable
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "supabase>=2.10",
    "pillow>=10.4",
    "numpy>=2.0",
    "gradio_client>=1.4",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023", "BLE", "E501"]
